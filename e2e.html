<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>e2e</title></head>
<body>
<iframe id="f" src="index.html" style="width:900px;height:700px"></iframe>
<pre id="out">RUNNING</pre>
<script>
const out = document.getElementById('out');
function png(color) {
  const c = document.createElement('canvas'); c.width = 320; c.height = 240;
  const x = c.getContext('2d'); x.fillStyle = color; x.fillRect(0, 0, 320, 240);
  return new Promise(r => c.toBlob(r, 'image/png'));
}
window.addEventListener('load', () => setTimeout(run, 1000));
async function run() {
  try {
    const w = document.getElementById('f').contentWindow, d = w.document;
    const dt = new w.DataTransfer();
    for (let i = 0; i < 3; i++) {
      const b = await png(['#c33','#3c3','#33c'][i]);
      dt.items.add(new w.File([b], 't' + i + '.png', { type: 'image/png' }));
    }
    const input = d.getElementById('fileinput');
    input.files = dt.files;
    input.dispatchEvent(new w.Event('change', { bubbles: true }));
    await new Promise(r => setTimeout(r, 800));
    const thumbs = d.querySelectorAll('#filelist .thumb').length;
    d.getElementById('convert').click();
    await new Promise(r => setTimeout(r, 3000));
    const href = d.getElementById('download').href;
    let head = '', bytes = 0;
    if (href && href.startsWith('blob:')) {
      const buf = await w.fetch(href).then(r => r.arrayBuffer());
      bytes = buf.byteLength;
      head = String.fromCharCode.apply(null, new Uint8Array(buf.slice(0, 5)));
    }
    out.textContent = JSON.stringify({
      done: true, thumbs, pdfHead: head, bytes,
      name: d.getElementById('done-name').textContent,
      size: d.getElementById('done-size').textContent,
      visible: !d.getElementById('done').hidden
    });
  } catch (e) { out.textContent = JSON.stringify({ done: false, err: String(e) }); }
}
</script>
</body></html>
